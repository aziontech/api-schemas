  /account/auth/login:
    post:
      operationId: auth_user_login
      description: "This endpoint performs user authentication and issues the user's\
        \ JWT tokens. The response depends on whether multi-factor authentication\
        \ (MFA) is enabled for the user:\n - If the user does not have MFA enabled,\
        \ the API returns a TokenPair object containing the access_token and refresh_token,\
        \ allowing immediate authentication.\n - If the user has MFA enabled, the\
        \ response returns an MFAToken object. This temporary token must be used in\
        \ the MFA verification endpoint to complete authentication. After successful\
        \ verification of the second factor, the TokenPair is issued."
      summary: User Login – Generate JWT Tokens
      tags:
      - Auth - Login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseLogin'
          description: User authenticated successfully. Returns JWT tokens or MFA
            token if MFA is enabled.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
  /account/auth/login/method:
    get:
      operationId: auth_user_login_method
      description: 'Returns the login type configured for the user. This indicates
        whether the user authenticates directly via Azion credentials (login) or via
        a federated Identity Provider (federated) linked to their account.

        This endpoint allows clients to determine whether to proceed with Azion''s
        native login flow or redirect the user to the Identity Provider (IdP) for
        authentication.'
      summary: Check User Authentication Method
      parameters:
      - in: query
        name: email
        schema:
          type: string
          format: email
        description: Email address of the user
      - $ref: '#/components/parameters/FieldsParam'
      tags:
      - Auth - Login
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLoginMethodResponse'
              examples:
                ExampleResponseForLoginMethod.:
                  value:
                    method: login
                    url: http://localhost:9999/login
                  summary: Example response for login method.
                ExampleResponseForFederatedLoginMethod.:
                  value:
                    method: federated
                    url: http://localhost:8000/login
                  summary: Example response for federated login method.
          description: User authentication method retrieved successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
