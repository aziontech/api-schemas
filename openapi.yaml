        name:
          type: string
          minLength: 1
          pattern: .*
          maxLength: 255
        path:
          type: string
          nullable: true
          pattern: .*
          maxLength: 255
          minLength: 0
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/WAFExceptionConditionRequest'
          minItems: 1
        operator:
          allOf:
          - $ref: '#/components/schemas/WAFRuleOperatorEnum'
          default: contains
        active:
          type: boolean
          default: true
      required:
      - conditions
      - name
      title: WAFRuleRequest
      additionalProperties: false
    WAFRuleResponse:
      type: object
      properties:
        state:
          type: string
          default: executed
          pattern: .*
          minLength: 1
          maxLength: 8
        data:
          $ref: '#/components/schemas/WAFRule'
      required:
      - data
      title: WAFRuleResponse
      additionalProperties: false
    Workload:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          format: int64
        name:
          type: string
          pattern: .*
          maxLength: 100
          minLength: 1
        active:
          type: boolean
          default: true
        last_editor:
          type: string
          readOnly: true
          pattern: .*
          maxLength: 250
          minLength: 1
        last_modified:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        infrastructure:
          allOf:
          - $ref: '#/components/schemas/InfrastructureEnum'
          default: 1
        tls:
          allOf:
          - $ref: '#/components/schemas/TLSWorkload'
        protocols:
          allOf:
          - $ref: '#/components/schemas/Protocols'
        mtls:
          allOf:
          - $ref: '#/components/schemas/MTLS'
        domains:
          type: array
          items:
            type: string
            pattern: .*
        workload_domain_allow_access:
          type: boolean
        workload_domain:
          type: string
          readOnly: true
          default: ''
          pattern: .*
        product_version:
          type: string
          readOnly: true
          pattern: ^(custom|\d+\.\d+)$
      required:
      - name
      title: Workload
      additionalProperties: false
    WorkloadDomainAvailability:
      type: object
      description: Whether a domain under the Azion workload suffix can be given to
        a new workload.
      properties:
        domain:
          type: string
          readOnly: true
        available:
          type: boolean
          readOnly: true
        reason:
          allOf:
          - $ref: '#/components/schemas/WorkloadDomainAvailabilityReasonEnum'
          readOnly: true
          nullable: true
          description: 'Why the domain cannot be used, or null when it is available.


            * `already_in_use` - already_in_use

            * `invalid_format` - invalid_format'
          type: string
      title: WorkloadDomainAvailability
      additionalProperties: false
    WorkloadDomainAvailabilityReasonEnum:
      enum:
      - already_in_use
      - invalid_format
      type: string
      description: '* `already_in_use` - already_in_use

        * `invalid_format` - invalid_format'
      title: WorkloadDomainAvailabilityReasonEnum
      x-extensible-enum:
      - already_in_use
      - invalid_format
    WorkloadRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          pattern: .*
          maxLength: 100
        active:
          type: boolean
          default: true
        infrastructure:
          allOf:
          - $ref: '#/components/schemas/InfrastructureEnum'
          default: 1
        tls:
          allOf:
          - $ref: '#/components/schemas/TLSWorkloadRequest'
        protocols:
          allOf:
          - $ref: '#/components/schemas/ProtocolsRequest'
        mtls:
          allOf:
          - $ref: '#/components/schemas/MTLSRequest'
        domains:
          type: array
          items:
            type: string
